<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama Dos Bocas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/orgchart/2.1.9/css/jquery.orgchart.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/orgchart/2.1.9/js/jquery.orgchart.min.js"></script>
  <link rel="stylesheet" href="style2.css">
</head>

<body>
  <header>
    <div class="Org-Header">
      <div class="Org-Central"><h2>Central</h2></div>
      <div class="Org-DB"><h2>Dos Bocas</h2></div>
      <div class="Org-C"><h2>Cadereyta</h2></div>
      <div class="Org-Ch"><h2>Chetumal</h2></div>
      <div class="Org-Esc"><h2>Escarcega</h2></div>              
      <div class="Org-Min"><h2>Minatitlán</h2></div>
      <div class="Org-Logo"><img src="personal/logo.png" alt=""></div>
      
    </div>
  </header>  
  <div id="chart-container-wrapper">
    
    <div id="chart-container"></div>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal">
    
    <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modal-image" src="" alt="Profile Picture">
      <div id="modal-name"></div>
      <div id="modal-title"></div>
      <div id="modal-phrase"></div>
    </div>
  </div>

  <script src="script2.js"></script>
</body>

</html>
